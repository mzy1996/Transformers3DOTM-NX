# ============================================================================
#  T3DOTM.toml —— Xbox 360《变形金刚3：月黑之时》Switch 移植 可选配置模板
# ----------------------------------------------------------------------------
#  放置位置：与 T3DOTM.nro 同一个目录，即
#        sdmc:/switch/Transformers3DOTM/T3DOTM.toml
#  文件名必须正好是 T3DOTM.toml —— 程序是按「应用名 + ".toml"」拼出这个路径的
#        exe_dir / (GetName() + ".toml")
#  改名字、换目录都不会被读取（程序只按这一个路径找，找不到就用内置默认值）。
#
#  三条写入规则
#   1) 文件不存在 = 全部用内置默认值，不报错、不提示、也没有警告。
#      想确认「文件到底被读到了没有」：把下面的 log_level 改成 "debug"，
#      日志里会出现一行  Loaded config: T3DOTM.toml  （默认 info 等级看不到这行）。
#   2) 下面所有键都必须写在【顶层】，不能套 [Memory] / [Log] 这类子表。
#      写成子表后键名会变成 Memory_guest_memory_large_pages 之类，
#      程序按原名查不到对应变量，会静默丢弃 —— 不报错，但也不生效。
#      唯一的例外是本文件最末尾的 [log.levels]，那张表是程序专门识别的。
#   3) 每个键都是可选的：不需要的整行删掉，或保持 # 注释状态即可。
#      布尔 true/false；整数直接写；字符串要加英文双引号。
# ============================================================================


# ============================================================================
# 一、guest 内存页表档位（本工程 fix23 新增，排查卡死时的重点 A/B 开关）
# ----------------------------------------------------------------------------
# 作用：决定 guest 窗口基址的对齐方式，从而决定内核能否用 2 MB 块描述符
#       整块映射，而不是退化成 4 KB 页表（4 KB 页表会把页表块用尽，
#       日志里表现为大量 svcMapProcessMemory core=0x0000CE01 拒绝）。
#   0 = 关闭：窗口按 4 KB 对齐（fix22 及之前的行为，0x0000CE01 的来源）
#   1 = 窗口按 32 MB 对齐（fix23 起的默认值）
#   2 = 在 1 的基础上，再把 0xE0000000 视图的 4 KB 相位对齐到物理竞技场
# 生效时机：只在启动瞬间读取一次（lifecycle=init-only），改了必须重启游戏。
#
# 怎么确认它生效：看 rex_stderr.log 里这一行
#   [fix23] paginas grandes modo=N ventana base=0x... (desfase 2 MB=0x...) bloques=0x200000
#   "desfase 2 MB" 必须是 0x0。
#   如果出现 "base alineada ... RECHAZADA" 说明没取到对齐窗口，
#   程序会退回 4 KB 基址，此时 desfase 必然不是 0。
#
# 实测记录：modo=1 时 0x0000CE01 已 0 次命中、bloques 2 MB 持续增长，
#   说明「页表块耗尽」这个问题在 1 档就已经解决了 —— 本行的 2 属于收尾 A/B。
# 想回到 fix23 默认：把下面改成 1，或整行删掉，无副作用。
guest_memory_large_pages = 2


# ============================================================================
# 二、日志（卡死排查时最有用的一节）
# ----------------------------------------------------------------------------
# 日志等级：trace / debug / info / warn / error / critical / off（默认 info）
# 注意：开到 trace/debug 会明显拖慢运行（尤其 SD 卡写入），只在抓细节时开。
#log_level = "info"

# 打开它等价于把等级提到 trace（等级还是 info 时会自动变成 trace）
#log_verbose = false

# 高频噪声宏（每秒大量重复的日志），默认关
#log_noisy = false

# 逐条记录内核调用（NtCreateFile / NtAllocateVirtualMemory 等）——
# 排查「卡在哪个系统调用」，这一项性价比最高
#log_high_frequency_kernel_calls = false

# 异步写日志，默认关。
# 卡死排查期间建议保持关闭：进程一停，还在队列里的最后一批日志就落不了盘
#log_async = false
#log_async_cola = 8192

# 日志文件：默认空 = 自动按 <应用名>_001.log / _002.log ... 轮转
#log_file = ""
# 单个文件上限（MB）与保留份数
#log_max_file_size_mb = 5
#log_max_files = 20
# 定期 flush 间隔（秒），0 = 关闭。进程被强杀时能保住多少日志就看这一项
#log_flush_interval = 1


# ============================================================================
# 三、数据路径（谨慎改！改错会导致找不到游戏文件）
# ----------------------------------------------------------------------------
# 默认留空 = 自动推导，而自动推导才是推荐路线：
#   game_data_root   -> <NRO目录>/game     （含 default.xex，日志里 2343 个条目）
#   update_data_root -> <NRO目录>/update   （TU，default.xexp 等 11 个条目）
#   patched 层由程序自己指向 <NRO目录>/patched
# 关键：程序判断「game_data_root 为空就自动推导，非空就认为用户手动指定了」。
#   一旦这里被填了值，整段自动推导会被直接跳过 ——
#   连 update/ 和 patched/ 都不会再自动挂载（TU 会悄悄不生效）。
#   所以除非确实要指到别的盘外路径，下面两行请保持注释状态。
#
# 路径要写成 Switch 上的 POSIX 风格，例如
#   update_data_root = "sdmc:/switch/Transformers3DOTM/update"
#game_data_root = ""
#update_data_root = ""


# ============================================================================
# 四、显示与性能
# ----------------------------------------------------------------------------
# 垂直同步（默认开）。想区分「真的卡死」还是「只是等 vsync」可临时关掉对比
#vsync = true

# guest 视频模式（游戏认为自己跑在什么分辨率和刷新率上；默认 1280x720 / 60Hz）
#video_mode_width = 1280
#video_mode_height = 720
#video_mode_refresh_rate = 60.0

# 强行指定各向异性过滤强度：-1=不覆盖  0=关  1=1x  2=2x  3=4x（默认 3）
# 数值越高斜视时纹理越清晰，纹理采样开销也越大 —— 帧率吃紧时可以试 1 或 0
#anisotropic_override = 3

# 异步着色器编译（默认开）。排查与着色器编译相关的停顿时可临时关掉
#async_shader_compilation = true

# 清内存页状态（默认开，GPU 相关优化）
#clear_memory_page_state = true

# 每帧性能计数导出 CSV（留空 = 关闭）。要精确看帧耗时分布时填一个路径：
#perf_log_csv = "sdmc:/switch/Transformers3DOTM/perf.csv"


# ============================================================================
# 五、改这里没用，但需要知道的键（留作说明，建议不要写进本文件）
# ----------------------------------------------------------------------------
# gpu_plugin          —— 应用会在启动阶段强制改成 "xenos"（OnPostInitLogging
#                        里的 REXCVAR_SET），本文件写什么都不生效。
# rexcrt_heap_size_mb —— 同上，应用会强制改成 768（给 UE3 纹理流留的余量）。
# fullscreen / window_width / window_height —— Switch 上由 Horizon 接管全屏，基本无感。
# log_nonblocking / switch_stall_report / switch_gpu_mhz / switch_cp_core ——
#                        这几个键在本工程的 SDK 里并不存在（属别的移植工程），
#                        写进来会被静默忽略，不要用。


# ============================================================================
# 六、按子系统单独调等级
# ----------------------------------------------------------------------------
# 这张表是程序专门识别的（唯一允许出现的子表），其余键不要写成表。
# 内置分类名：core / cpu / apu / gpu / krnl / sys / fs
#   krnl 覆盖 xboxkrnl 的内核调用段（日志里的 [krnl]），fs 覆盖 VFS/文件挂载。
# 用途：只把 krnl 提到 debug，既能看到细节又不至于全量刷屏。
# 启用时取消下面注释即可（必须放在文件最后，TOML 里表之后的键都算表内）：
#
# [log.levels]
# krnl = "debug"
# fs   = "debug"